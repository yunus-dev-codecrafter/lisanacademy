<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Lisanun Mubeen Academy</title>
    <meta name="theme-color" content="#064e3b">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <style>
        :root {
            --emerald-950: #022c22;
            --emerald-900: #064e3b;
            --emerald-700: #047857;
            --gold: #c9a24b;
            --gold-light: #e3c98b;
            --bg: #f3f6f2;
            --surface: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --radius: 16px;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-card {
            background: var(--surface);
            max-width: 440px;
            width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 36px 28px;
            text-align: center;
            border-top: 5px solid var(--gold);
        }

        .offline-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 8px 20px rgba(6, 78, 59, 0.2);
        }

        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fef3c7;
            color: #92400e;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 999px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: 1.45rem;
            color: var(--emerald-950);
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 24px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, var(--emerald-900), var(--emerald-700));
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(6, 78, 59, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 78, 59, 0.4);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #d97706;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.6s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img class="offline-logo" src="/assets/icons/icon-192.png" alt="Lisanun Mubeen">
        <div class="offline-badge">
            <span class="pulse-dot"></span>
            No Connection
        </div>
        <h1>You are currently offline</h1>
        <p>Lisanun Mubeen Academy requires an internet connection to load lessons, sync progress, and submit your recitations. Please verify your mobile data or Wi-Fi.</p>
        <button class="btn-retry" onclick="checkConnection()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Try Reconnecting
        </button>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                const btn = document.querySelector('.btn-retry');
                const orig = btn.innerHTML;
                btn.innerHTML = 'Still offline... retrying';
                setTimeout(() => { btn.innerHTML = orig; }, 1500);
            }
        }

        // Automatically reload when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
